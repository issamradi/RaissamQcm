<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Raissam Qcm</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* 🎨 VARIABLES CSS (Permet de basculer les couleurs instantanément) */
    :root {
      --bg-main: #f8fafc;
      --bg-sidebar: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --btn-bg: #f1f5f9;
      --btn-hover: #ffffff;
    }
    
    /* 🌙 COULEURS DU MODE SOMBRE */
    body.dark-mode {
      --bg-main: #0f172a;
      --bg-sidebar: rgba(31, 30, 30);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --btn-bg: rgba(26, 25, 25);
      --btn-hover: rgba(26, 25, 25);
    }

    body { 
      margin: 0; 
      font-family: 'Inter', sans-serif; 
      display: flex; 
      height: 100vh; 
      overflow: hidden; 
      background: var(--bg-main); 
      color: var(--text-main);
      transition: background 0.3s, color 0.3s; 
    }

    /* ==== BARRE LATÉRALE ==== */
    .sidebar { 
      width: 280px; 
      background: var(--bg-sidebar); 
      backdrop-filter: blur(10px); 
      border-right: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      box-shadow: 4px 0 15px rgba(0,0,0,0.05); 
      z-index: 20; 
      transition: transform 0.3s, background 0.3s, border-color 0.3s; 
    }
    .sidebar.hidden { transform: translateX(-100%); position: absolute; height: 100%; }
    
    .sidebar-header { 
      padding: 20px 24px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--border); 
      transition: border-color 0.3s;
    }
    
    .sidebar h2 { font-size: 18px; margin: 0; font-weight: 700; color: var(--text-main); }
    .close-btn { background: transparent; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); }
    .close-btn:hover { color: #ef4444; }
    
    .nav-links { display: flex; flex-direction: column; gap: 12px; padding: 24px; flex: 1; }
    
    .menu-link { 
      display: block; 
      padding: 14px 18px; 
      text-decoration: none; 
      color: var(--text-muted); 
      font-weight: 600; 
      font-size: 14px; 
      border-radius: 12px; 
      border: 1px solid transparent; 
      background: var(--btn-bg); 
      transition: all 0.2s ease; 
    }
    
    .menu-link:hover { 
      background: var(--btn-hover); 
      color: #3b82f6; 
      border-color: #93c5fd; 
      transform: translateY(-2px); 
    }

    /* ==== BOUTON THÈME ==== */
    .theme-toggle {
      margin: 24px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .theme-toggle:hover { background: var(--btn-hover); border-color: #93c5fd; }

    /* ==== ZONE D'AFFICHAGE ==== */
    .content { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); transition: background 0.3s; }
    .top-bar { 
      height: 60px; 
      display: flex; 
      align-items: center; 
      padding: 0 16px; 
      background: var(--bg-sidebar); 
      border-bottom: 1px solid var(--border); 
      transition: background 0.3s, border-color 0.3s; 
    }
    
    .open-btn { 
      background: var(--btn-bg); 
      border: 1px solid var(--border); 
      padding: 8px 14px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      color: var(--text-main); 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      transition: all 0.2s; 
    }
    
    iframe { width: 100%; height: calc(100% - 60px); border: none; }
    
    @media (max-width: 768px) { .sidebar { position: absolute; height: 100%; } }
  </style>
</head>
<body>

  <div class="sidebar hidden" id="mySidebar">
    <div class="sidebar-header">
      <h2>📚 Raissam Qcm</h2>
      <button class="close-btn" onclick="toggleSidebar()">✖</button>
    </div>
    
    <div class="nav-links">
      <a href="genetique.html" class="menu-link" target="qcm-frame" onclick="closeOnMobile()">🧬 QCM Pr Dehbi</a>
      <a href="immuno.html" class="menu-link" target="qcm-frame" onclick="closeOnMobile()">🦠 QCM Pr Moudatir</a>
    </div>

    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Mode Sombre</button>
  </div>
  
  <div class="content">
    <div class="top-bar">
      <button class="open-btn" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        Menu
      </button>
    </div>
    <iframe name="qcm-frame" id="qcmFrame" src="genetique.html" title="Zone de contenu QCM"></iframe>
  </div>

  <script>
    // 📂 GESTION DU MENU
    function toggleSidebar() { document.getElementById('mySidebar').classList.toggle('hidden'); }
    function closeOnMobile() { if (window.innerWidth <= 768) toggleSidebar(); }

    // 🌗 GESTION DU MODE SOMBRE
    const body = document.body;
    const themeBtn = document.getElementById('themeBtn');
    const iframe = document.getElementById('qcmFrame');

    function applyTheme(theme) {
      if (theme === 'dark') {
        body.classList.add('dark-mode');
        themeBtn.innerHTML = '☀️ Mode Clair';
      } else {
        body.classList.remove('dark-mode');
        themeBtn.innerHTML = '🌙 Mode Sombre';
      }
      // 💾 Sauvegarde dans le navigateur
      localStorage.setItem('theme', theme);
      
      // 📡 Envoi du thème à la page dans l'iframe
      if(iframe.contentWindow) {
        iframe.contentWindow.postMessage(theme, '*');
      }
    }

    function toggleTheme() {
      const currentTheme = localStorage.getItem('theme') === 'dark' ? 'light' : 'dark';
      applyTheme(currentTheme);
    }

    // 🔄 Appliquer le thème au lancement de la page
    window.onload = () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      applyTheme(savedTheme);
    }
  </script>
</body>
</html>
